      - SERVER_PORT=5678
      - INPUT_FILE=/app/input/input-0.csv
      - OUTPUT_FILE=/app/output/output-1.csv
      - BATCH_SIZE=10
    volumes:
    - ./input:/app/input
    - ./output:/app/output
