services:
  server:
    build:
      context: ./services/server
      dockerfile: Dockerfile
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - BATCH_SIZE=10
      - AGENCY_QUORUM_MIN=6
    ports:
      - "5678:5678"

  client_0:
    build:
      context: ./services/client
      dockerfile: Dockerfile
    container_name: client_0
    depends_on:
      - server
    environment:
      - AGENCY_ID=0
      - SERVER_HOST=server
      - SERVER_PORT=5678
      - INPUT_FILE=/app/input/input-0.csv
      - OUTPUT_FILE=/app/output/output-0.csv
      - BATCH_SIZE=10
    volumes:
    - ./input:/app/input
    - ./output:/app/output

  client_1:
    build:
